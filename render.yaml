services:
  - type: web
    name: pid-duel
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
